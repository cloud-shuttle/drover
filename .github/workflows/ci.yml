name: CI

# Runs on every pull request and every push to main.
# Two jobs run in sequence:
#   1. build-and-test  — compile, vet, race-test, produce coverage.out
#   2. quality-gate    — CRAP score analysis using the coverage artefact
#
# The quality-gate job enforces a Phase-1 limit of 10 000.
# Reduce over time as coverage improves: 5000 → 1000 → 30 (target ceiling).

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Job 1: Build, vet, and test ────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-go v5 automatically caches the module cache and build cache
      # using go.sum as the cache key — no separate actions/cache step needed.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector + coverage)
        run: |
          go test ./... \
            -race \
            -count=1 \
            -timeout 300s \
            -coverprofile=coverage.out \
            -covermode=atomic

      # Upload coverage.out so the quality-gate job can download it
      # without re-running the full test suite.
      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 7

  # ─── Job 2: CRAP score quality gate ─────────────────────────────────────────
  quality-gate:
    name: Quality Gate (CRAP)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage artefact
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # quality-gate.py uses only Python stdlib — no pip install needed.
      # Scan path is the repo root ('.') so cmd/, internal/, and pkg/ are all covered.
      # Previously run-quality-gate.sh passed "$ROOT/drover" (the compiled binary),
      # causing the scanner to audit 0 files. Fixed here and in the shell script.
      - name: Run quality gate
        run: |
          python3 scripts/quality-gate.py . \
            --coverage coverage.out \
            --limit 10000
